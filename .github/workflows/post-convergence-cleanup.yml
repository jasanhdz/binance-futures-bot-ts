name: Post Convergence Cleanup
on:
  push:
    branches:
      - work/architecture-convergence-final-20260829
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare test configuration
        run: cp config/regime_config.example.yaml regime_config.yaml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply targeted cleanup
        run: python3 scripts/post_convergence_cleanup.py
      - name: Diff check
        run: git diff --check
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Verify no strategy-owned shared order-book wrapper
        run: |
          test ! -f src/strategies/micro-burst/domain/SynchronizedOrderBook.ts
          test -f src/core/market-data/SynchronizedOrderBook.behavior.test.ts
          test -f src/core/market-data/RollingAggTradeBuffer.behavior.test.ts
      - name: Commit validated cleanup
        run: |
          git config user.name "Jasan Hernández"
          git config user.email "31332180+jasanhdz@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No post-convergence changes"
            exit 0
          fi
          git commit -m "refactor: align residual market-data and test ownership"
          git push origin HEAD:work/architecture-convergence-final-20260829
