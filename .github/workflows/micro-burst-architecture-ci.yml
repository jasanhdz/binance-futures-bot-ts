name: Micro Burst Architecture CI

on:
  push:
    branches:
      - work/micro-burst-rider-v1-20260826
  pull_request:
    branches:
      - work/ts-multisymbol-momentum-20260826

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Unit and integration tests
        run: npm test
