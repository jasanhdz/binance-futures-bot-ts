name: Phase T3.5 Shared Market Data Ownership Lift

on:
  push:
    branches:
      - work/micro-burst-rider-v1-20260826

permissions:
  contents: write

jobs:
  lift:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/micro-burst-rider-v1-20260826
          fetch-depth: 0
      - name: Prepare test configuration
        run: cp config/regime_config.example.yaml regime_config.yaml
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Wire shared runtime into production composition
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/app/services/TradingService.ts')
          s = p.read_text()
          a = "import { JsonlMarketSnapshotSink } from '../../infra/logging/JsonlMarketSnapshotSink';\n"
          assert a in s
          s = s.replace(a, a + "import { SharedMarketDataRuntime } from './SharedMarketDataRuntime';\n", 1)
          a = "  private microBurstRuntime: MicroBurstRuntime | null = null;\n"
          assert a in s
          s = s.replace(a, a + "  private sharedMarketDataRuntime: SharedMarketDataRuntime | null = null;\n", 1)
          a = "    const mbConfig = this.getMicroBurstConfig();\n    if (mbConfig.enabled && mbConfig.mode !== 'OFF') {"
          r = "    const mbConfig = this.getMicroBurstConfig();\n    this.sharedMarketDataRuntime ??= new SharedMarketDataRuntime({\n      exchange: this.deps.exchange,\n      logger: this.deps.logger,\n      clock: { now: () => Date.now() },\n    });\n    if (mbConfig.enabled && mbConfig.mode !== 'OFF') {"
          assert a in s
          s = s.replace(a, r, 1)
          a = "        const outcomeTracker = new MicroBurstOutcomeTracker({\n"
          r = "        this.sharedMarketDataRuntime.setArchiveObserver({\n          onDepth: (symbol, depth) => {\n            storage?.appendDepth({ symbol, eventTime: depth.E, receivedAtMs: depth.receivedAtMs, E: depth.E, T: depth.T, U: depth.U, u: depth.u, pu: depth.pu, b: depth.bids, a: depth.asks });\n          },\n          onAggTradeGap: (symbol, gap) => {\n            storage?.recordGap?.({ symbol, startedAtMs: gap.previousEventTimeMs ?? gap.nextEventTimeMs, endedAtMs: gap.nextEventTimeMs, reason: 'AGG_TRADE_SEQUENCE_GAP', kind: 'AGG_TRADE_SEQUENCE', feed: 'AGG_TRADE', previousAggregateTradeId: gap.previousAggregateTradeId, nextAggregateTradeId: gap.nextAggregateTradeId, previousFirstTradeId: gap.previousFirstTradeId, previousLastTradeId: gap.previousLastTradeId, nextFirstTradeId: gap.nextFirstTradeId, nextLastTradeId: gap.nextLastTradeId, dedupeKey: gap.dedupeKey });\n          },\n          hasAggTradeGap: (symbol, fromMs, toMs) => storage?.hasAggTradeGap?.(symbol, fromMs, toMs) ?? false,\n        });\n\n" + a
          assert a in s
          s = s.replace(a, r, 1)
          a = "            strategyRouter: this.microBurstStrategyRouter,\n            blackBox: {"
          r = "            strategyRouter: this.microBurstStrategyRouter,\n            orderBookDataPlane: this.sharedMarketDataRuntime.orderBookDataPlane,\n            aggTradeDataPlane: this.sharedMarketDataRuntime.aggTradeDataPlane,\n            blackBox: {"
          assert a in s
          s = s.replace(a, r, 1)
          p.write_text(s)
      - name: Mark isolated Micro Burst plane fallback as non-production
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/strategies/micro-burst/application/MicroBurstRuntime.ts')
          s = p.read_text()
          a = "  orderBookDataPlane?: OrderBookDataPlane<SynchronizedOrderBook>;\n  aggTradeDataPlane?: AggTradeDataPlane<RollingAggTradeBuffer>;\n"
          r = "  /** @deprecated Isolated-test fallback only. Production injects app-owned shared planes. */\n  orderBookDataPlane?: OrderBookDataPlane<SynchronizedOrderBook>;\n  /** @deprecated Isolated-test fallback only. Production injects app-owned shared planes. */\n  aggTradeDataPlane?: AggTradeDataPlane<RollingAggTradeBuffer>;\n"
          assert a in s
          p.write_text(s.replace(a, r, 1))
      - name: Format
        run: npx prettier --write src/app/services/SharedMarketDataRuntime.ts src/app/services/SharedMarketDataRuntime.test.ts src/app/services/TradingService.ts src/strategies/micro-burst/application/MicroBurstRuntime.ts
      - name: Bind authorized TradingService digest
        shell: python
        run: |
          from hashlib import sha256
          from pathlib import Path
          import re
          digest = sha256(Path('src/app/services/TradingService.ts').read_bytes()).hexdigest()
          p = Path('src/restoration/original-operational-semantics.test.ts')
          s = p.read_text()
          pattern = r"('src/app/services/TradingService\.ts':\s*\n\s*')[a-f0-9]{64}(',)"
          s, count = re.subn(pattern, rf"\g<1>{digest}\g<2>", s, count=1)
          assert count == 1
          p.write_text(s)
          print(digest)
      - run: npx prettier --write src/restoration/original-operational-semantics.test.ts
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Commit T3.5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "refactor(market-data): lift shared stream ownership to application" || exit 0
          git push origin HEAD:work/micro-burst-rider-v1-20260826
