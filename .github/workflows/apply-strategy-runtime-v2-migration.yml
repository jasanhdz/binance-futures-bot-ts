name: Apply Strategy Runtime V2 Migration

on:
  push:
    branches:
      - work/micro-burst-rider-v1-20260826
    paths:
      - scripts/apply-strategy-runtime-v2-migration.mjs

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/micro-burst-rider-v1-20260826
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply migration
        run: node scripts/apply-strategy-runtime-v2-migration.mjs

      - name: TypeScript build guardrail
        run: |
          npm ci
          npm run build

      - name: Commit migration result
        run: |
          if git diff --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/services/TradingService.ts
          git commit -m "refactor: route runtime positions by strategy owner"
          git push origin HEAD:work/micro-burst-rider-v1-20260826
