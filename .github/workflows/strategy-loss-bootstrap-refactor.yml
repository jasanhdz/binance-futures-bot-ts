name: Strategy Loss Bootstrap Refactor
on:
  push:
    branches: [work/micro-burst-rider-v1-20260826]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/micro-burst-rider-v1-20260826
          fetch-depth: 0
      - run: cp config/regime_config.example.yaml regime_config.yaml
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Patch TradingService to generic loss store
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/app/services/TradingService.ts')
          s=p.read_text()
          old="""import {
  AegisConsecutiveLossState,
  AegisConsecutiveLossStateStorePort,
} from '../../strategies/aegis/application/AegisConsecutiveLossStateStore';"""
          new="""import type {
  StrategyLossStateStorePort,
  StrategyLossStateWrite,
} from '../../infra/state/StrategyLossStateStore';"""
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace('consecutiveLossStateStore?: AegisConsecutiveLossStateStorePort;', 'consecutiveLossStateStore?: StrategyLossStateStorePort;', 1)
          s=s.replace('const state: AegisConsecutiveLossState = {', 'const state: StrategyLossStateWrite = {', 1)
          s=s.replace("schema_id: 'aegis-consecutive-loss-state-v1',", "schema_id: 'strategy-loss-state-v2',", 1)
          p.write_text(s)
      - name: Update generic store tests and architecture contracts
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/infra/state/StrategyLossStateStore.test.ts')
          s=p.read_text()
          s=s.replace("new StrategyLossStateStore({ filePath: statePath, schemaId: 'test-v1' })", "new StrategyLossStateStore({ strategyId: 'TEST', filePath: statePath })")
          s=s.replace("schema_id: 'test-v1',", "schema_id: 'strategy-loss-state-v2',\n      strategy_id: 'TEST',")
          if "total_losses:" not in s:
            s=s.replace("consecutive_losses: 2,", "consecutive_losses: 2,\n      total_losses: 2,\n      total_wins: 0,\n      last_result: 'LOSS',")
          p.write_text(s)

          p=Path('src/restoration/phase2-architecture-contracts.test.ts')
          s=p.read_text()
          s=s.replace("  'src/strategies/aegis/application/AegisConsecutiveLossStateStore.ts',\n", "")
          p.write_text(s)
      - name: Remove obsolete Aegis-specific loss store
        shell: bash
        run: |
          rm -f src/strategies/aegis/application/AegisConsecutiveLossStateStore.ts
          rm -f src/strategies/aegis/application/AegisConsecutiveLossStateStore.test.ts
      - run: npx prettier --write src/app/services/TradingService.ts src/app/bootstrap src/infra/state src/restoration/phase2-architecture-contracts.test.ts
      - name: Update authorized architecture digests
        shell: python
        run: |
          from pathlib import Path
          import hashlib,re
          p=Path('src/restoration/original-operational-semantics.test.ts')
          s=p.read_text()
          for file_path in ['src/app/services/TradingService.ts']:
            digest=hashlib.sha256(Path(file_path).read_bytes()).hexdigest()
            pattern=rf"('{re.escape(file_path)}':\s*\n?\s*)'[0-9a-f]{{64}}'"
            s,n=re.subn(pattern, lambda m:m.group(1)+"'"+digest+"'", s, count=1)
            assert n==1, file_path
          p.write_text(s)
      - run: npx prettier --write src/restoration/original-operational-semantics.test.ts
      - run: npm run build
      - run: npm test -- --run
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A src
          git commit -m 'refactor(loss-state): generalize strategy loss persistence and simplify bootstrap' || exit 0
          git push
