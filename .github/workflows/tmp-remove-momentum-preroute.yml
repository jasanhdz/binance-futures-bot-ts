name: Temporary Momentum Preroute Removal

on:
  push:
    branches:
      - work/micro-burst-rider-v1-20260826
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/micro-burst-rider-v1-20260826

      - name: Apply migration
        run: python scripts/tmp_remove_momentum_preroute.py

      - name: Prepare test configuration
        run: cp config/regime_config.example.yaml regime_config.yaml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Unit and integration tests
        run: npm test

      - name: Commit migration
        run: |
          git config user.name "Jasan Hernández"
          git config user.email "31332180+jasanhdz@users.noreply.github.com"
          git add src/app/services/TradingService.ts src/strategies/momentum/domain/MomentumRideEntryPolicy.ts src/restoration/original-operational-semantics.test.ts
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
          else
            git commit -m "refactor(legacy): route Momentum only through StrategyRouter"
            git push origin HEAD:work/micro-burst-rider-v1-20260826
          fi
