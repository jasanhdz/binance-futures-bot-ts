name: Temporary TradingService Config Extraction

on:
  push:
    branches:
      - work/trading-service-thin-config-20260830
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/trading-service-thin-config-20260830

      - name: Apply migration
        run: python scripts/tmp_extract_runtime_config.py

      - name: Refresh authorized digest
        run: sed -i 's/ea85dec2bf7f884cd20254009d8a0984102d1dd9500e708e2c10779ae6754a5a/cbb2f1344d3cf507ce087ee9dcbabc3f693ebffb5cc8dc8ac6d81f7ed5b1951f/' src/restoration/original-operational-semantics.test.ts

      - name: Prepare test configuration
        run: cp config/regime_config.example.yaml regime_config.yaml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Unit and integration tests
        run: npm test

      - name: Commit migration
        run: |
          git config user.name "Jasan Hernández"
          git config user.email "31332180+jasanhdz@users.noreply.github.com"
          git add src/app/services/TradingService.ts src/app/config/TradingRuntimeConfigService.ts src/restoration/original-operational-semantics.test.ts
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
          else
            git commit -m "refactor(config): move runtime defaults out of TradingService"
            git push origin HEAD:work/trading-service-thin-config-20260830
          fi
