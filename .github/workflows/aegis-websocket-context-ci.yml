name: Aegis WebSocket Context CI

on:
  push:
    branches:
      - work/aegis-websocket-context-v1-20260829
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare test configuration
        run: cp config/regime_config.example.yaml regime_config.yaml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Unit and integration tests
        run: npm test
