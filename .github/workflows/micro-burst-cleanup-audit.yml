name: Micro Burst Cleanup Audit

on:
  push:
    branches:
      - work/micro-burst-rider-v1-20260826
    paths:
      - '.github/workflows/micro-burst-cleanup-audit.yml'
      - 'src/strategies/micro-burst/**'
      - 'src/core/market-data/**'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit compatibility references
        shell: bash
        run: |
          set -euo pipefail
          for n in \
            MicroBurstAggTradeBuffer \
            MicroBurstConfigLoader \
            MicroBurstOutcomeEngine \
            MicroBurstOutcomeTypes \
            MicroBurstPaperTrading \
            MicroBurstExitPolicy \
            MicroBurstMarketDataTypes \
            MicroBurstTypes; do
            echo "===== $n ====="
            grep -RIn --exclude-dir=node_modules --exclude-dir=.git --include='*.ts' --include='*.tsx' "$n" src tools scripts tests 2>/dev/null || true
          done
          echo '===== BTC/benchmark references ====='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git --include='*.ts' -E 'BtcMicroContextProvider|BenchmarkMarketData|ret1m|ret3m|ret5m|acceleration' src/strategies src/core 2>/dev/null || true
      - name: Build
        run: npm ci && npm run build
      - name: Tests
        run: npx vitest run
