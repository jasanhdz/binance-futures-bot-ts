name: Apply Runtime Cleanup V1

on:
  push:
    branches:
      - work/micro-burst-rider-v1-20260826
    paths:
      - scripts/apply-runtime-cleanup-v1.mjs

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/micro-burst-rider-v1-20260826
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply cleanup
        run: |
          node scripts/apply-runtime-cleanup-v1.mjs
          git rm -f \
            src/app/strategy/LegacyStrategyCompatibility.ts \
            src/app/strategy/LegacyStrategyCompatibility.test.ts \
            src/app/strategy/LegacyStrategyRuntimeFactory.ts \
            src/app/strategy/LegacyStrategyRuntimeFactory.test.ts \
            src/app/strategy/MomentumRideStrategyAdapter.ts \
            src/app/strategy/StrategyRuntimeCoordinator.ts \
            src/app/strategy/StrategyTelemetry.ts \
            config/regimen.config.yaml

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Targeted architecture tests
        run: |
          npx vitest run \
            src/app/services/TradingService.aegis-live.test.ts \
            src/app/services/TradingService.exit-eye.test.ts \
            src/app/strategy/StrategyRouter.test.ts \
            src/app/strategy/PositionManagerRouter.test.ts \
            src/domain/strategies/momentum-ride/MomentumRideEntryPolicy.test.ts \
            --reporter=dot

      - name: Dead-reference guard
        shell: bash
        run: |
          set -euo pipefail
          for token in LegacyStrategyCompatibility LegacyStrategyRuntimeFactory MomentumRideStrategyAdapter StrategyRuntimeCoordinator StrategyTelemetry; do
            if git grep -n "$token" -- 'src/**' ':!*.test.ts'; then
              echo "Unexpected production reference remains for $token"
              exit 1
            fi
          done
          test ! -e config/regimen.config.yaml

      - name: Commit as jasanhdz
        env:
          GIT_AUTHOR_NAME: Jasan Hernández
          GIT_AUTHOR_EMAIL: 31332180+jasanhdz@users.noreply.github.com
          GIT_COMMITTER_NAME: Jasan Hernández
          GIT_COMMITTER_EMAIL: 31332180+jasanhdz@users.noreply.github.com
        run: |
          git config user.name "Jasan Hernández"
          git config user.email "31332180+jasanhdz@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes"
            exit 0
          fi
          git commit -m "refactor: clean strategy runtime boundaries"
          git push origin HEAD:work/micro-burst-rider-v1-20260826
