name: Strategy Loss Runtime Wire
on:
  push:
    branches:
      - work/micro-burst-rider-v1-20260826
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/micro-burst-rider-v1-20260826
          fetch-depth: 0
      - run: cp config/regime_config.example.yaml regime_config.yaml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: python scripts/tmp-wire-strategy-loss-runtime.py
      - run: npx prettier --write src/app/services/TradingService.ts src/restoration/original-operational-semantics.test.ts
      - run: npm run build
      - run: npm test -- --run
      - name: Commit runtime wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/services/TradingService.ts src/restoration/original-operational-semantics.test.ts
          git commit -m 'feat(loss-state): record Momentum and manual streaks generically' || exit 0
          git push
