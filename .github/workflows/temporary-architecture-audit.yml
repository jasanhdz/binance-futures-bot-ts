name: Temporary Architecture Cleanup Audit

on:
  push:
    branches:
      - work/micro-burst-rider-v1-20260826
    paths:
      - .github/workflows/temporary-architecture-audit.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/micro-burst-rider-v1-20260826
          fetch-depth: 0

      - name: Inspect runtime hotspots
        shell: bash
        run: |
          set -euo pipefail
          echo '=== PORTFOLIO EXPOSURE METHOD ==='
          line=$(grep -n "readAegisPortfolioExposure" src/app/services/TradingService.ts | tail -1 | cut -d: -f1)
          start=$((line-10)); end=$((line+120)); sed -n "${start},${end}p" src/app/services/TradingService.ts
          echo '=== TICK METHOD ==='
          line=$(grep -n -E "async tick\(|tick\(symbol" src/app/services/TradingService.ts | head -1 | cut -d: -f1)
          start=$((line-20)); end=$((line+140)); sed -n "${start},${end}p" src/app/services/TradingService.ts
          echo '=== MANAGE POSITION HEAD ==='
          line=$(grep -n "managePositionLegacy" src/app/services/TradingService.ts | tail -1 | cut -d: -f1)
          start=$((line)); end=$((line+145)); sed -n "${start},${end}p" src/app/services/TradingService.ts
