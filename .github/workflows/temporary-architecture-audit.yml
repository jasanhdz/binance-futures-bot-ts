name: Temporary Architecture Cleanup Audit

on:
  push:
    branches:
      - work/micro-burst-rider-v1-20260826
    paths:
      - .github/workflows/temporary-architecture-audit.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/micro-burst-rider-v1-20260826
          fetch-depth: 0

      - name: Inspect runtime hotspots
        shell: bash
        run: |
          set -u
          echo '=== ALL EXPOSURE REFERENCES ==='
          grep -n "readAegisPortfolioExposure" src/app/services/TradingService.ts || true
          echo '=== STATE EXPOSURE HELPER ==='
          grep -n "countStateOpenPositions" src/app/services/TradingService.ts || true
          echo '=== POSITION LIFECYCLE DEFINITIONS ==='
          grep -n -E "managePosition(Legacy|Lifecycle)|strategyLifecyclePolicy" src/app/services/TradingService.ts || true
