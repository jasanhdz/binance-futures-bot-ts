name: Fix Micro Burst Cleanup Workflow
on:
  push:
    branches: [work/micro-burst-rider-v1-20260826]
    paths: ['.github/workflows/micro-burst-cleanup-workflow-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix generated convergence assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/micro-burst-cleanup-apply.yml')
          t = p.read_text()
          old = "existsSync(resolve(repoRoot, 'src/strategies/micro-burst/domain/MicroBurstAggTradeBuffer.ts'))"
          if old not in t:
              raise SystemExit('expected workflow expression not found')
          p.write_text(t.replace(old, 'false'))
          PY
          git diff --check
      - name: Commit workflow fix
        run: |
          git config user.name 'Jasan Hernández'
          git config user.email '31332180+jasanhdz@users.noreply.github.com'
          git add .github/workflows/micro-burst-cleanup-apply.yml
          git commit -m 'fix: correct guarded cleanup convergence assertion'
          git push origin HEAD:work/micro-burst-rider-v1-20260826
