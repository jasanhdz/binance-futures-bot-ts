name: Phase T3 Wire Micro Burst Black Box

on:
  push:
    branches:
      - work/micro-burst-rider-v1-20260826

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/micro-burst-rider-v1-20260826
          fetch-depth: 0
      - name: Prepare test configuration
        run: cp config/regime_config.example.yaml regime_config.yaml
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply Phase T3 composition patch
        shell: python
        run: |
          from pathlib import Path

          runtime = Path('src/strategies/micro-burst/application/MicroBurstRuntime.ts')
          text = runtime.read_text()
          anchor = "import { MarketDataCandleProvider } from '../../../core/market-data/MarketDataCandleProvider';\n"
          addition = anchor + "import type { DecisionEvidenceSink, MarketSnapshotEvidenceSink } from '../../../core/blackbox/StrategyDecisionBlackBox';\nimport { createMicroBurstBlackBoxObservation } from './MicroBurstBlackBoxObservation';\n"
          assert anchor in text
          text = text.replace(anchor, addition, 1)

          anchor = "  aggTradeDataPlane?: AggTradeDataPlane<RollingAggTradeBuffer>;\n}\n\nexport class MicroBurstRuntime"
          addition = "  aggTradeDataPlane?: AggTradeDataPlane<RollingAggTradeBuffer>;\n  blackBox?: {\n    decisionSink: DecisionEvidenceSink;\n    marketSnapshotSink: MarketSnapshotEvidenceSink;\n  };\n}\n\nexport class MicroBurstRuntime"
          assert anchor in text
          text = text.replace(anchor, addition, 1)

          anchor = "    this.shadowEvaluator = new MicroBurstShadowEvaluator("
          addition = "    if (this.deps.blackBox) {\n      this.deps.strategyRouter.setObservationHook(\n        createMicroBurstBlackBoxObservation({\n          clock,\n          candles: candleProvider,\n          orderBookFor: (symbol) => this.symbolStates.get(symbol.toUpperCase())?.book,\n          aggTradeFor: (symbol) => this.symbolStates.get(symbol.toUpperCase())?.aggTradeBuffer,\n          decisionSink: this.deps.blackBox.decisionSink,\n          marketSnapshotSink: this.deps.blackBox.marketSnapshotSink,\n        }),\n      );\n      logger.info('micro_burst_decision_blackbox_attached', {\n        schema: 'STRATEGY_DECISION_BLACKBOX_V1',\n        authority: 'OBSERVATIONAL_ONLY',\n        liveExecution: false,\n      });\n    }\n\n    this.shadowEvaluator = new MicroBurstShadowEvaluator("
          assert anchor in text
          text = text.replace(anchor, addition, 1)

          anchor = "  stop(): Promise<void> {\n"
          addition = "  stop(): Promise<void> {\n    this.deps.strategyRouter.setObservationHook(undefined);\n"
          assert anchor in text
          text = text.replace(anchor, addition, 1)
          runtime.write_text(text)

          service = Path('src/app/services/TradingService.ts')
          text = service.read_text()
          anchor = "import { MicroBurstStorage } from '../../strategies/micro-burst/research/MicroBurstStorage';\n"
          addition = anchor + "import { JsonlDecisionEvidenceSink } from '../../infra/logging/JsonlDecisionEvidenceSink';\nimport { JsonlMarketSnapshotSink } from '../../infra/logging/JsonlMarketSnapshotSink';\n"
          assert anchor in text
          text = text.replace(anchor, addition, 1)

          anchor = "            strategyRouter: this.microBurstStrategyRouter,\n            outcomeTracker,"
          addition = "            strategyRouter: this.microBurstStrategyRouter,\n            blackBox: {\n              decisionSink: new JsonlDecisionEvidenceSink(\n                'data/strategy-blackbox/strategy-decisions/decisions-v1.jsonl',\n              ),\n              marketSnapshotSink: new JsonlMarketSnapshotSink(\n                'data/strategy-blackbox/market-snapshots/snapshots-v1.jsonl',\n              ),\n            },\n            outcomeTracker,"
          assert anchor in text
          text = text.replace(anchor, addition, 1)
          service.write_text(text)
      - name: Format changed files
        run: npx prettier --write src/core/blackbox/StrategyDecisionBlackBox.ts src/core/blackbox/StrategyDecisionBlackBox.test.ts src/core/strategy/StrategyRouter.ts src/infra/logging/JsonlDecisionEvidenceSink.test.ts src/infra/logging/JsonlMarketSnapshotSink.ts src/strategies/micro-burst/application/MicroBurstBlackBoxObservation.ts src/strategies/micro-burst/application/MicroBurstRuntime.ts src/app/services/TradingService.ts
      - name: Bind authorized observational TradingService change
        shell: python
        run: |
          from hashlib import sha256
          from pathlib import Path
          import re

          service = Path('src/app/services/TradingService.ts').read_bytes()
          digest = sha256(service).hexdigest()
          contract = Path('src/restoration/original-operational-semantics.test.ts')
          text = contract.read_text()
          pattern = r"('src/app/services/TradingService\.ts':\s*\n\s*')[a-f0-9]{64}(',)"
          updated, count = re.subn(pattern, rf"\g<1>{digest}\g<2>", text, count=1)
          assert count == 1
          contract.write_text(updated)
          print(f'Authorized observational TradingService digest: {digest}')
      - name: Format restoration contract
        run: npx prettier --write src/restoration/original-operational-semantics.test.ts
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "feat(micro-burst): attach phase T decision black box runtime" || exit 0
          git push origin HEAD:work/micro-burst-rider-v1-20260826
