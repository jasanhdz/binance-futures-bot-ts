name: Micro Burst Ref Audit
on:
  push:
    branches: [work/micro-burst-rider-v1-20260826]
    paths: ['.github/workflows/micro-burst-ref-audit.yml']
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          echo '===== MicroBurstMarketDataTypes imports ====='
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git --include='*.ts' 'MicroBurstMarketDataTypes' src tools scripts 2>/dev/null || true
          echo '===== Types defined there and consumers ====='
          for n in BtcCandleObservation BtcReturnSet MicroBurstReferencePrice ReferencePriceSource MicroBurstShadowEvaluationInput MicroBurstShadowEvaluationResult MicroBurstShadowTelemetryLog MicroBurstSymbolConfig MicroBurstRuntimeConfig TemporalBookSnapshot BOOK_PRESSURE_FEATURE_DEPTH; do
            echo "--- $n ---"
            grep -RIn --exclude-dir=node_modules --exclude-dir=.git --include='*.ts' "$n" src tools scripts 2>/dev/null || true
          done
