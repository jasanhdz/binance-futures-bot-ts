name: Temporary Position Recovery Extraction

on:
  push:
    branches:
      - work/micro-burst-rider-v1-20260826

permissions:
  contents: write

jobs:
  extract-and-test:
    if: github.event.head_commit.message != 'refactor(position): extract recovery from TradingService'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/micro-burst-rider-v1-20260826

      - name: Apply extraction
        run: python scripts/tmp_extract_position_recovery.py

      - name: Prepare test configuration
        run: cp config/regime_config.example.yaml regime_config.yaml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Unit and integration tests
        run: npm test

      - name: Commit extraction
        run: |
          git config user.name "Jasan Hernández"
          git config user.email "31332180+jasanhdz@users.noreply.github.com"
          git add src/app/services/TradingService.ts src/restoration/original-operational-semantics.test.ts
          if git diff --cached --quiet; then
            echo "No extraction changes to commit"
          else
            git commit -m "refactor(position): extract recovery from TradingService"
            git push origin HEAD:work/micro-burst-rider-v1-20260826
          fi
