name: Temporary TradingService Runtime Access Extraction

on:
  push:
    branches:
      - work/trading-service-thin-runtime-access-20260830
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/trading-service-thin-runtime-access-20260830
      - name: Apply migration
        run: python scripts/tmp_extract_runtime_access.py
      - name: Refresh authorized digest
        run: |
          NEW_DIGEST=$(sha256sum src/app/services/TradingService.ts | awk '{print $1}')
          python - "$NEW_DIGEST" <<'PY'
          import re, sys
          from pathlib import Path
          p = Path('src/restoration/original-operational-semantics.test.ts')
          t = p.read_text()
          key = "'src/app/services/TradingService.ts':"
          i = t.index(key)
          tail = t[i:]
          tail = re.sub(r"'[0-9a-f]{64}'", "'" + sys.argv[1] + "'", tail, count=1)
          p.write_text(t[:i] + tail)
          PY
      - name: Prepare test configuration
        run: cp config/regime_config.example.yaml regime_config.yaml
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript build
        run: npm run build
      - name: Unit and integration tests
        run: npm test
      - name: Commit migration
        run: |
          git config user.name "Jasan Hernández"
          git config user.email "31332180+jasanhdz@users.noreply.github.com"
          git add src/app/services/TradingService.ts src/app/config/TradingRuntimeConfigService.ts src/restoration/original-operational-semantics.test.ts
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
          else
            git commit -m "refactor(config): move runtime accessors out of TradingService"
            git push origin HEAD:work/trading-service-thin-runtime-access-20260830
          fi
