name: Neutral Bootstrap Cleanup
on:
  push:
    branches: [work/micro-burst-rider-v1-20260826]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/micro-burst-rider-v1-20260826
          fetch-depth: 0
      - run: cp config/regime_config.example.yaml regime_config.yaml
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Neutralize process entry and strategy state import
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/app/services/TradingService.ts')
          s=p.read_text()
          old="from '../../infra/state/AegisConsecutiveLossStateStore';"
          new="from '../../strategies/aegis/application/AegisConsecutiveLossStateStore';"
          assert old in s
          p.write_text(s.replace(old,new,1))
          lines = [
            "/** Process entry point. Strategy composition lives behind the application bootstrap boundary. */",
            "import { createTradingApplication } from './app/bootstrap/TradingApplicationBootstrap';",
            "",
            "async function main(): Promise<void> {",
            "  console.log('Trading System');",
            "  console.log('==============');",
            "",
            "  const application = createTradingApplication();",
            "  console.log(`Runtime mode: ${application.summary.runtimeMode}`);",
            "  console.log(`Active symbols: ${application.summary.symbols.join(', ')}`);",
            "  console.log(`Tick interval: ${application.summary.tickIntervalMs}ms`);",
            "",
            "  let exiting = false;",
            "  const shutdown = async (signal: 'SIGINT' | 'SIGTERM'): Promise<void> => {",
            "    if (exiting) return;",
            "    exiting = true;",
            "    const completed = await application.stop(signal);",
            "    process.exit(completed ? 0 : 1);",
            "  };",
            "",
            "  process.on('SIGINT', () => void shutdown('SIGINT'));",
            "  process.on('SIGTERM', () => void shutdown('SIGTERM'));",
            "",
            "  try {",
            "    await application.start();",
            "  } catch (error) {",
            "    console.error('Fatal startup error:', error);",
            "    process.exitCode = 1;",
            "  }",
            "}",
            "",
            "void main();",
          ]
          Path('src/main.ts').write_text('\n'.join(lines) + '\n')
      - run: npx prettier --write src/main.ts src/app/services/TradingService.ts src/app/bootstrap/TradingApplicationBootstrap.ts src/strategies/aegis/application/AegisMLService.ts src/strategies/aegis/application/AegisConsecutiveLossStateStore.ts
      - name: Bind authorized bootstrap and TradingService digests
        shell: python
        run: |
          from pathlib import Path
          import hashlib,re
          p=Path('src/restoration/original-operational-semantics.test.ts')
          s=p.read_text()
          main_digest=hashlib.sha256(Path('src/main.ts').read_bytes()).hexdigest()
          trading_digest=hashlib.sha256(Path('src/app/services/TradingService.ts').read_bytes()).hexdigest()
          s,n=re.subn(r"\s*'src/main\.ts': '[0-9a-f]{64}',\n", "\n", s, count=1)
          assert n==1
          marker="const ownerAuthorizedCurrentBrainContractDigests: Record<string, string> = {\n"
          assert marker in s
          s=s.replace(marker, marker+f"  // Owner-authorized neutral process bootstrap; strategy composition moved behind app boundary.\n  'src/main.ts': '{main_digest}',\n",1)
          s,n=re.subn(r"('src/app/services/TradingService\.ts':\s*\n\s*)'[0-9a-f]{64}'", lambda m:m.group(1)+"'"+trading_digest+"'", s, count=1)
          assert n==1
          p.write_text(s)
      - run: npx prettier --write src/restoration/original-operational-semantics.test.ts
      - run: npm run build
      - run: npm test -- --run
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.ts src/app/services/TradingService.ts src/app/bootstrap/TradingApplicationBootstrap.ts src/strategies/aegis/application/AegisMLService.ts src/strategies/aegis/application/AegisConsecutiveLossStateStore.ts src/restoration/original-operational-semantics.test.ts
          git commit -m 'refactor(bootstrap): neutralize process entry strategy coupling' || exit 0
          git push
