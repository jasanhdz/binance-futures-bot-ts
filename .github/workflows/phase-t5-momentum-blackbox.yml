name: Phase T5 Momentum Black Box
on:
  push:
    branches: [work/micro-burst-rider-v1-20260826]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/micro-burst-rider-v1-20260826
          fetch-depth: 0
      - run: cp config/regime_config.example.yaml regime_config.yaml
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Wire Momentum Ride observational black box
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/app/services/TradingService.ts'); s=p.read_text()
          a="import { AegisBlackBoxObservation } from '../../strategies/aegis/application/AegisBlackBoxObservation';\n"
          r=a+"import { MomentumRideBlackBoxObservation } from '../../strategies/momentum/application/MomentumRideBlackBoxObservation';\n"
          assert a in s; s=s.replace(a,r,1)
          a="  private aegisBlackBoxObservation: AegisBlackBoxObservation | null = null;\n"
          r=a+"  private momentumBlackBoxObservation: MomentumRideBlackBoxObservation | null = null;\n"
          assert a in s; s=s.replace(a,r,1)
          a="    this.aegisBlackBoxObservation.start(startupSymbols);\n"
          r=a+"    this.momentumBlackBoxObservation ??= new MomentumRideBlackBoxObservation({\n      exchange: this.deps.exchange,\n      sharedMarketData: this.sharedMarketDataRuntime,\n      clock: { now: () => Date.now() },\n      decisionSink: new JsonlDecisionEvidenceSink(\n        'data/strategy-blackbox/strategy-decisions/decisions-v1.jsonl',\n      ),\n      marketSnapshotSink: new JsonlMarketSnapshotSink(\n        'data/strategy-blackbox/market-snapshots/snapshots-v1.jsonl',\n      ),\n    });\n    this.momentumBlackBoxObservation.start(startupSymbols);\n    this.momentumStrategyRouter.setObservationHook(this.momentumBlackBoxObservation);\n"
          assert a in s; s=s.replace(a,r,1)
          a="      this.aegisBlackBoxObservation?.close();\n      this.aegisBlackBoxObservation = null;\n"
          r=a+"      this.momentumStrategyRouter.setObservationHook(undefined);\n      this.momentumBlackBoxObservation?.close();\n      this.momentumBlackBoxObservation = null;\n"
          assert a in s; s=s.replace(a,r,1)
          p.write_text(s)
      - run: npx prettier --write src/app/services/TradingService.ts src/strategies/momentum/application/MomentumRideBlackBoxObservation.ts
      - name: Bind authorized TradingService digest
        shell: python
        run: |
          from pathlib import Path
          import hashlib, re
          service=Path('src/app/services/TradingService.ts')
          digest=hashlib.sha256(service.read_bytes()).hexdigest()
          p=Path('src/restoration/original-operational-semantics.test.ts'); s=p.read_text()
          s,n=re.subn(r"('src/app/services/TradingService\\.ts':\\s*\\n\\s*)'[0-9a-f]{64}'", lambda m:m.group(1)+"'"+digest+"'", s, count=1)
          assert n==1
          p.write_text(s)
      - run: npx prettier --write src/restoration/original-operational-semantics.test.ts
      - run: npm run build
      - run: npm test -- --run
      - name: Commit T5
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/services/TradingService.ts src/strategies/momentum/application/MomentumRideBlackBoxObservation.ts src/restoration/original-operational-semantics.test.ts
          git commit -m 'feat(momentum): observe decisions in strategy black box' || exit 0
          git push
