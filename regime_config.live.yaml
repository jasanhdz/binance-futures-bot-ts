# ═══════════════════════════════════════════════════════════════════════
# AEGIS TURBO: Micro-live configuration (safe by default)
# ═══════════════════════════════════════════════════════════════════════
SYMBOLS:
  ETHUSDT: 1.0

symbols:
  defaults:
    enabled: true
    mode: LIVE
  entries:
    ETHUSDT: {}
    BTCUSDT: {}
    SOLUSDT: {}
    BNBUSDT: {}
    XRPUSDT: {}
    DOGEUSDT: {}
    ADAUSDT: {}
    AVAXUSDT: {}
    LINKUSDT: {}
    SUIUSDT: {}
    LTCUSDT: {}

TRADING:
  capital_usage_default: 1.0        
  min_wallet_reserve_usdt: 0         
  fee_buffer_pct: 0.03            
  max_risk_pct: 0.02                 
  low_funds_threshold: 2             
  reenter_on_tp: true               
  post_exit_timeout_ms: 60000       

SYSTEM:
  tick_interval_ms: 2000
  max_trades_per_day: 100
  global_leverage_default: 15
  enable_sentinel: false

IMMUNE_SYSTEM: { alpha_slow_rise: 0.15, alpha_fast_fall: 0.70, panic_exit_threshold: 0.55 }

REGIMES:
  AEGIS_TURBO:
    leverage: 20
    entry_threshold: 0.60
    hard_stop_roe: -0.40
    tp_roe: 0.50
    be_roe: 0.08
    trailing_step: 0.015
    trailing_activation_roe: 0.15
    trailing_callback_roe: 0.08
    max_trade_duration_ms: 28800000
    use_exit_agent: false

REGIME_PROFILES:
  AEGIS_TURBO:
    reduced_15x:
      leverage: 15
    reduced_10x:
      leverage: 10
    reduced_8x:
      leverage: 8

aegis:
  phase_o_short_live:
    enabled: true
    mode: EXPERIMENTAL_LIVE
    side: SHORT_ONLY
    capital_profile: TEST_CAPITAL
    allow_orders: true
    require_brackets: true
    max_open_phase_o_positions: 9
    max_phase_o_trades_per_day: 20
    align_short_leverage_with_long: true
    remove_legacy_short_leverage_downshift: true
    leverage:
      conservative: 15
      normal: 20
      premium: 25
      max_allowed_leverage: 30
    guard_modes:
      phase_o_ml: ENFORCE
      momentum_ride: ENFORCE
      clean_entry: SHADOW
      event_risk: SHADOW
      entry_quality: SHADOW
      decision_brain: SHADOW
      regime_engine: SHADOW
      risk_shadow_guards: SHADOW
    hard_safety:
      brackets: ENFORCE
      max_open_positions: ENFORCE
      max_trades_per_day: ENFORCE
      daily_loss_stop: ENFORCE
      exchange_min_notional: ENFORCE
      exchange_order_errors: ENFORCE
      link_no_entry: ENFORCE
    allow_link_entry: false
    link_avoid_only: true
    symbols:
      LTCUSDT: {enabled: true, caution_level: normal}
      AVAXUSDT: {enabled: true, caution_level: normal}
      ETHUSDT: {enabled: true, caution_level: cautious}
      SUIUSDT: {enabled: true, caution_level: normal}
      ADAUSDT: {enabled: true, caution_level: normal}
      DOGEUSDT: {enabled: true, caution_level: cautious}
      BTCUSDT: {enabled: true, caution_level: very_cautious}
      BNBUSDT: {enabled: true, caution_level: normal}
      XRPUSDT: {enabled: true, caution_level: cautious}
      SOLUSDT: {enabled: true, caution_level: final_repair_candidate}
      LINKUSDT: {enabled: true, entry_enabled: false, avoid_only: true}
  entry_policy:
    enabled: true
    # The current Python committee is the entry authority. TypeScript evaluates
    # these analytical overlays for counterfactual telemetry only; execution
    # safety, exchange filters, brackets, cooldowns and loss limits stay enforced.
    guards:
      regime:
        enabled: true
        mode: SHADOW
      regime_context:
        enabled: true
        mode: SHADOW
      momentum_ride:
        enabled: true
        mode: SHADOW
      decision_brain:
        enabled: true
        mode: SHADOW
      entry_quality:
        enabled: true
        mode: SHADOW
      event_risk:
        enabled: true
        mode: SHADOW
      clean_entry:
        enabled: true
        mode: SHADOW
        use_entry_quality_model_as_source_of_truth: true
        ignore_rule_gate_insufficient_data_when_model_ok: true
        min_feature_parity_pct: 95
      probe_mode:
        enabled: true
        mode: SHADOW
      long_risk_shadow:
        enabled: true
        mode: SHADOW
        probe_long_critical_action: SHADOW
        probe_long_high_action: SHADOW
        aegis_long_critical_action: SHADOW
        momentum_long_critical_action: SHADOW
        min_risk_level_to_block_probe: CRITICAL
        block_only_probe_mode: true
        block_only_long: true
      short_gate:
        enabled: true
        mode: SHADOW
  regime_guard:
    enabled: true
    mode: SHADOW
    source: HYBRID_HEURISTIC
    allow_when:
      - MOMENTUM_UP
      - MOMENTUM_DOWN
      - BREAKOUT_UP
      - BREAKOUT_DOWN
      - TREND_UP
      - TREND_DOWN
    block_when:
      - CHOP
      - EXHAUSTION
      - RISK_OFF
      - HIGH_VOL_RISK
      - UNKNOWN
    min_confidence: 0.60
    max_snapshot_age_seconds: 900
    high_tail_risk_threshold: 0.45
    require_btc_eth_alignment_for_alts: true
    allow_alt_long_when_btc_short: false
    allow_alt_short_when_btc_long: false
    telemetry:
      log_all_evaluations: true
      include_in_entry_metadata: true
  regime_context:
    enabled: true
    mode: SHADOW
    timeframe: 5m
    allowed_for:
      momentum_ride: true
    indicators:
      ema_fast: 7
      ema_mid: 25
      ema_slow: 99
      atr_window: 14
      volume_window: 20
      bollinger_window: 20
      adx_window: 14
      choppiness_window: 14
    thresholds:
      max_choppiness_for_momentum: 55
      min_adx_for_momentum: 18
      min_volume_ratio_for_momentum: 1.3
      max_atr_percentile_for_aggressive: 0.80
      max_exhaustion_score: 0.60
  momentum_ride:
    enabled: true
    mode: ENFORCE
    research_mode: true
    regime_filter:
      enabled: true
      use_as_gate: false
      record_metadata: true
      ignore_for_entry: true
    allow_momentum_when_aegis_denied: false
    require_aegis_direction_confirmation: true
    allow_momentum_against_aegis: false
    require_btc_eth_not_contradicting: true
    require_btc_eth_confirmation: false
    defaults:
      long:
        position_fraction: 0.01
        min_turbo_score: 0.90
        min_volume_ratio: 1.55
        momentum_candles: 3
        max_tail_risk_score: 0.25
        require_close_near_extreme: true
        min_close_location: 0.70
        max_wick_ratio: 0.35
        max_overextension_pct: 0.10
        allowed_regimes: [MOMENTUM_UP, TREND_UP, BREAKOUT_UP]
      short:
        position_fraction: 0.01
        min_turbo_score: 0.94
        min_volume_ratio: 1.75
        momentum_candles: 3
        max_tail_risk_score: 0.22
        require_close_near_extreme: true
        min_close_location: 0.70
        max_wick_ratio: 0.35
        max_overextension_pct: 0.08
        allowed_regimes: [MOMENTUM_DOWN, TREND_DOWN, BREAKOUT_DOWN]
    profiles:
      major_high_confidence_long:
        leverage: 25
        min_turbo_score: 0.88
        min_volume_ratio: 1.35
        max_tail_risk_score: 0.28
      major_short:
        leverage: 25
        position_fraction: 0.01
        min_turbo_score: 0.92
        min_volume_ratio: 1.45
        max_tail_risk_score: 0.25
      xrp_long:
        leverage: 25
        min_turbo_score: 0.85
        min_volume_ratio: 1.50
        max_tail_risk_score: 0.30
      xrp_short:
        leverage: 25
        min_turbo_score: 0.92
        min_volume_ratio: 1.70
        max_tail_risk_score: 0.25
      stable_alt_long:
        leverage: 25
        min_turbo_score: 0.88
        min_volume_ratio: 1.40
        max_tail_risk_score: 0.28
      stable_alt_short:
        leverage: 20
        min_turbo_score: 0.93
        min_volume_ratio: 1.60
        max_tail_risk_score: 0.24
      medium_alt_long:
        leverage: 25
        min_volume_ratio: 1.50
      medium_alt_short:
        leverage: 15
        min_volume_ratio: 1.70
      volatile_alt_long:
        leverage: 20
        position_fraction: 0.01
        min_volume_ratio: 1.60
        max_tail_risk_score: 0.23
      volatile_alt_short:
        leverage: 15
        position_fraction: 0.01
        min_turbo_score: 0.95
        min_volume_ratio: 1.80
        max_tail_risk_score: 0.20
      meme_alt_long:
        leverage: 15
        position_fraction: 0.01
        min_turbo_score: 0.92
        min_volume_ratio: 1.80
        max_tail_risk_score: 0.22
      meme_alt_short:
        leverage: 15
        position_fraction: 0.01
        min_turbo_score: 0.95
        min_volume_ratio: 1.90
        max_tail_risk_score: 0.20
      high_noise_alt_long:
        leverage: 15
        position_fraction: 0.01
        min_turbo_score: 0.92
        min_volume_ratio: 1.80
        max_tail_risk_score: 0.22
      high_noise_alt_short:
        leverage: 15
        position_fraction: 0.01
        min_turbo_score: 0.95
        min_volume_ratio: 1.90
        max_tail_risk_score: 0.20
    symbols:
      BTCUSDT:
        enabled: true
        mode: ENFORCE
        long:
          enabled: true
          profile: major_high_confidence_long
        short:
          enabled: true
          profile: major_short
      ETHUSDT:
        enabled: true
        mode: ENFORCE
        long:
          enabled: true
          profile: major_high_confidence_long
          max_tail_risk_score: 0.30
        short:
          enabled: true
          profile: major_short
          leverage: 25
          max_tail_risk_score: 0.26
      XRPUSDT:
        enabled: true
        mode: ENFORCE
        long:
          enabled: true
          profile: xrp_long
        short:
          enabled: true
          profile: xrp_short
      BNBUSDT:
        enabled: true
        mode: ENFORCE
        long:
          enabled: true
          profile: stable_alt_long
          leverage: 25
        short:
          enabled: true
          profile: stable_alt_short
          leverage: 20
      LTCUSDT:
        enabled: true
        mode: ENFORCE
        long:
          enabled: true
          profile: stable_alt_long
        short:
          enabled: true
          profile: stable_alt_short
      LINKUSDT:
        enabled: true
        mode: ENFORCE
        long:
          enabled: true
          profile: medium_alt_long
        short:
          enabled: true
          profile: medium_alt_short
      ADAUSDT:
        enabled: true
        mode: ENFORCE
        long:
          enabled: true
          profile: medium_alt_long
          position_fraction: 0.01
          max_tail_risk_score: 0.24
        short:
          enabled: true
          profile: medium_alt_short
      AVAXUSDT:
        enabled: true
        mode: ENFORCE
        long:
          enabled: true
          profile: volatile_alt_long
        short:
          enabled: true
          profile: volatile_alt_short
      SOLUSDT:
        enabled: true
        mode: ENFORCE
        long:
          enabled: true
          profile: volatile_alt_long
        short:
          enabled: true
          profile: volatile_alt_short
      DOGEUSDT:
        enabled: true
        mode: ENFORCE
        long:
          enabled: true
          profile: meme_alt_long
        short:
          enabled: true
          profile: meme_alt_short
      SUIUSDT:
        enabled: true
        mode: ENFORCE
        long:
          enabled: true
          profile: high_noise_alt_long
        short:
          enabled: true
          profile: high_noise_alt_short
    safety_caps:
      max_leverage: 30
      max_position_fraction: 0.01
      max_open_momentum_positions: 1
      max_total_open_positions_when_momentum: 2
      max_momentum_trades_per_day: 3
      max_consecutive_momentum_losses: 2
      cooldown_after_loss_minutes: 60
      disable_symbol_after_stop_loss_minutes: 120
      require_brackets: true
      require_profit_protection: true
  event_risk:
    enabled: true
    mode: CAUTION
    enforce: false
    manual_override_enabled: true
    caution:
      min_quality_score: 0.65
      max_tail_risk_score: 0.45
      require_btc_eth_confirmation: true
    risk_off:
      min_quality_score: 0.75
      max_tail_risk_score: 0.35
      allow_only_a_plus: true
    manual_only:
      block_new_entries: false
  probe_mode:
    enabled: true
    mode: ENFORCE
    apply_when_event_risk:
      - CAUTION
    min_turbo_score: 0.90
    max_tail_risk_score: 0.30
    require_decision_brain: ENTER_NOW
    require_entry_quality_allow: true
    require_feature_status_ok: true
    min_feature_parity_pct: 95
    allow_if_blocked_only_by:
      - clean_entry_event_risk_would_block
      - caution_btc_eth_not_confirmed
    max_probe_entries_per_hour: 1
    min_minutes_between_probe_entries: 60
    max_open_probe_positions: 1
    max_total_open_positions_when_probe: 2
    block_after_consecutive_losses: 2
    block_after_recent_stop_loss_minutes: 60
  decision_enforcement:
    enabled: true
    mode: CONSERVATIVE
    block_do_not_enter: true
    block_wait_confirmation: true
    block_manual_only: true
    block_entry_quality_shadow_block_when_event_risk:
      enabled: true
      event_modes:
        - CAUTION
        - RISK_OFF
        - MANUAL_ONLY
    event_risk_enforcement:
      caution_blocks_weak_entries: true
      risk_off_blocks_non_a_plus: true
      manual_only_blocks_all_new_entries: true
    block_caution_would_block_unless_a_plus: true
    block_all_entry_quality_shadow_block: true
    block_all_tail_risk_high: false
  clean_entry_guard:
    enabled: true
    mode: ENFORCE
    apply_to:
      long: true
      short: true
    dirty_conditions:
      block_when_entry_quality_insufficient: true
      block_when_event_risk_would_block: true
      block_when_tail_risk_gte: 0.45
      block_when_entry_quality_not_allow: true
    require_clean_for_premium_symbols: true
    clean_conditions:
      require_decision_brain_enter_now: true
      require_entry_quality_allow: true
      require_no_insufficient_data: true
      require_event_risk_would_block_false: true
      max_tail_risk_score: 0.40
    exception:
      allow_extreme_momentum_in_shadow_only: true
      min_turbo_score: 0.97
      max_tail_risk_score: 0.35
    telemetry:
      log_all_evaluations: true
      include_in_entry_metadata: true
  telegram_notifications:
    automatic_block_alerts_enabled: false
    block_dedupe:
      enabled: true
      cooldown_minutes: 15
      summary_threshold: 25
      max_cache_entries: 1000
      include_suppressed_count: true
  profit_protection:
    enabled: true
    protect_profit_enabled: true
    min_peak_roe_to_protect: 0.08
    protect_giveback_roe: 0.05
    min_locked_roe: 0.01
    be_offset_pct: 0.003
    immediate_trigger_buffer_pct: 0.001
  portfolio_risk:
    enabled: false
  short_gate:
    enabled: true
    mode: PREMIUM_ONLY
    position_fraction_multiplier: 1.0
    max_leverage: 30
    block_symbols: []
    allow_if_regime_bearish: false
  entry_quality_gate:
    enabled: true
    mode: SHADOW
    min_score_long: 0.65
    min_score_short: 0.70
    require_momentum_confirm: true
    anti_falling_knife:
      enabled: true
      lookback_candles: 3
      max_adverse_recent_return: 0.003
    overextension:
      enabled: true
      ema_distance_limit: 0.006
    volatility:
      enabled: true
      max_atr_percentile: 0.75
  exit_eye:
    enabled: true
    mode: CLOSE
    min_roe_to_protect: 0.08
    min_peak_roe_to_protect: 0.12
    min_giveback_from_peak_roe: 0.04
    neutral_votes_to_protect: 2
    opposite_votes_to_close: 2
    min_roe_to_close_on_opposite: 0.06
    min_peak_roe_to_close_on_opposite: 0.10
    close_on_neutral_decay: true
    neutral_close_votes: 3
    min_roe_to_close_on_neutral: 0.08
    min_peak_roe_to_close_on_neutral: 0.12
    min_giveback_to_close_on_neutral: 0.04
    require_consecutive_neutral_close: 2
    require_consecutive_neutral: 2
    require_consecutive_opposite: 1
    min_minutes_in_trade: 3
  turbo:
    enabled: true
    live_enabled: true
    allow_short: true
    position_fraction_cap: 0.50
    # Optional bot-side sizing overrides. When a rule matches symbol + side,
    # the bot uses this fraction instead of Aegis ML raw.position_fraction.
    position_fraction_overrides:
      - name: majors_link_btc_eth_ada_long
        symbols: [LINKUSDT, BTCUSDT, ETHUSDT, ADAUSDT, XRPUSDT, BNBUSDT, DOGEUSDT]
        long: 0.01
      # Current-brain SHORT sizing tiers, frozen from Live MAE plus prospective
      # selected-outcome evidence. Unlisted SHORT symbols retain the 0.08 default.
      - name: xrp_short_high_confidence
        symbols: [XRPUSDT]
        short: 0.20
      - name: sui_ltc_short_supported
        symbols: [SUIUSDT, LTCUSDT]
        short: 0.16
      - name: ada_short_moderate_confidence
        symbols: [ADAUSDT]
        short: 0.12
    max_trades_per_day: 20
    max_consecutive_losses: 3
    daily_loss_stop_pct: 0.30
    min_cooldown_ms: 900000
    max_liquidity_stress: 0.70
    require_brackets: true
    close_if_bracket_fails: true

SYMBOL_OVERRIDES:
  ETHUSDT:
    AEGIS_TURBO: {}
  BTCUSDT:
    AEGIS_TURBO: {}
  SOLUSDT:
    AEGIS_TURBO: {}
