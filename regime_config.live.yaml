# ═══════════════════════════════════════════════════════════════════════
# NINJA v8.5: SNIPER GROWTH (Meta: $29 -> $100)
# ═══════════════════════════════════════════════════════════════════════
SYMBOLS:
  # --- ESCUADRÓN DE ÉLITE ---
  WLDUSDT: 0.95      
  1000PEPEUSDT: 0.95 
  SEIUSDT: 0.90      
  AVAXUSDT: 0.90     
  BTCUSDT: 0.85      
  SOLUSDT: 0.85      
  ETHUSDT: 0.85      
  BNBUSDT: 0.20      
  LTCUSDT: 0.80      

TRADING:
  capital_usage_default: 0.75        
  min_wallet_reserve_usdt: 0         
  fee_buffer_pct: 0.0004            
  # 🛡️ EL FUSIBLE: Máxima pérdida real de $0.58 USD por trade (2% de $29)
  max_risk_pct: 0.02                 
  low_funds_threshold: 2             
  reenter_on_tp: true               
  post_exit_timeout_ms: 60000       

SYSTEM:
  tick_interval_ms: 5000
  max_trades_per_day: 50             # 📉 CAP DE VOLUMEN: Evita el sobre-trading y fees
  global_leverage_default: 20        

REGIME_DETECTOR: 
  volatility_spread_low: 0.0008
  volatility_spread_high: 0.0015
  bias_strength_threshold: 0.15 
  obi_confirmation_threshold: 0.10

# 🧬 SISTEMA INMUNE AGRESIVO: Salir rápido si la probabilidad baja de 55%
IMMUNE_SYSTEM: { alpha_slow_rise: 0.15, alpha_fast_fall: 0.70, panic_exit_threshold: 0.55 }

# ═══════════════════════════════════════════════════════════════════════
# BASE REGIMES (Filtrado de alta precisión)
# ═══════════════════════════════════════════════════════════════════════
REGIMES:
  # MONK: Rango. Umbral subido a 0.48 para filtrar señales dudosas.
  MONK:       { leverage: 20, entry_threshold: 0.48, hard_stop_roe: -0.15, tp_roe: 0.08 }
  
  # WHALE: Tendencia. Solo entra con 55% de probabilidad (Pura fuerza).
  WHALE:      { leverage: 25,  entry_threshold: 0.55, hard_stop_roe: -0.25, tp_roe: 999.0 }
  
  # BLOODBATH: Caos. Umbral subido para evitar latigazos.
  BLOODBATH:  { leverage: 30, entry_threshold: 0.42, hard_stop_roe: -0.10, tp_roe: 0.02 }
  
  BUNKER:     { leverage: 0,  entry_threshold: 999.0, hard_stop_roe: 0.0,  tp_roe: 0.0 }

# ═════════════════════════════════════════════════════════════════════
# SYMBOL OVERRIDES
# ═════════════════════════════════════════════════════════════════════
SYMBOL_OVERRIDES:
  BTCUSDT:
    MONK:  { leverage: 25, hard_stop_roe: -0.10, entry_threshold: 0.45 } 
    WHALE: { leverage: 30, hard_stop_roe: -0.20, entry_threshold: 0.52 } 

  ETHUSDT:
    MONK:  { leverage: 25, hard_stop_roe: -0.12, entry_threshold: 0.45 }
    WHALE: { leverage: 30,  hard_stop_roe: -0.22, entry_threshold: 0.52 }

  1000PEPEUSDT:
    WHALE: { leverage: 5, hard_stop_roe: -0.30 } 
    MONK:  { leverage: 5, hard_stop_roe: -0.08 }

  WLDUSDT:
    WHALE: { leverage: 5 }
    MONK:  { leverage: 5 }
