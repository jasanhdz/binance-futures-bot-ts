# ═══════════════════════════════════════════════════════════════════════
# AEGIS TURBO: Micro-live configuration (safe by default)
# ═══════════════════════════════════════════════════════════════════════
SYMBOLS:
  ETHUSDT: 1.0

symbols:
  ETHUSDT:
    enabled: true
    mode: LIVE
  BTCUSDT:
    enabled: true
    mode: SHADOW
  SOLUSDT:
    enabled: true
    mode: SHADOW
  BNBUSDT:
    enabled: true
    mode: SHADOW
  XRPUSDT:
    enabled: true
    mode: SHADOW
  DOGEUSDT:
    enabled: true
    mode: SHADOW
  ADAUSDT:
    enabled: true
    mode: SHADOW
  AVAXUSDT:
    enabled: true
    mode: SHADOW
  LINKUSDT:
    enabled: true
    mode: SHADOW
  SUIUSDT:
    enabled: true
    mode: SHADOW
  LTCUSDT:
    enabled: true
    mode: SHADOW

TRADING:
  capital_usage_default: 1.0        
  min_wallet_reserve_usdt: 0         
  fee_buffer_pct: 0.03            
  max_risk_pct: 0.02                 
  low_funds_threshold: 2             
  reenter_on_tp: true               
  post_exit_timeout_ms: 60000       

SYSTEM:
  tick_interval_ms: 2000
  max_trades_per_day: 100
  global_leverage_default: 15
  enable_sentinel: false

IMMUNE_SYSTEM: { alpha_slow_rise: 0.15, alpha_fast_fall: 0.70, panic_exit_threshold: 0.55 }

REGIMES:
  AEGIS_TURBO:
    leverage: 20
    entry_threshold: 0.60
    hard_stop_roe: -0.40
    tp_roe: 0.50
    be_roe: 0.08
    trailing_step: 0.015
    trailing_activation_roe: 0.15
    trailing_callback_roe: 0.08
    max_trade_duration_ms: 28800000
    use_exit_agent: false

aegis:
  turbo:
    enabled: true
    live_enabled: true
    allow_short: true
    position_fraction_cap: 1.0
    max_trades_per_day: 99
    max_consecutive_losses: 2
    daily_loss_stop_pct: 0.10
    min_cooldown_ms: 900000
    max_liquidity_stress: 0.70
    require_brackets: true
    close_if_bracket_fails: true

SYMBOL_OVERRIDES: {}
