# ═══════════════════════════════════════════════════════════════════════
# PHANTOM V1: Deep Learning Trading (ETH Specialist)
# ═══════════════════════════════════════════════════════════════════════
SYMBOLS:
  # Only ETH for now - BTC/SOL Phantom models coming in future
  ETHUSDT: 1.0

TRADING:
  capital_usage_default: 1.0        
  min_wallet_reserve_usdt: 0         
  fee_buffer_pct: 0.0004            
  max_risk_pct: 0.02                 
  low_funds_threshold: 2             
  reenter_on_tp: true               
  post_exit_timeout_ms: 60000       

SYSTEM:
  tick_interval_ms: 5000
  max_trades_per_day: 50
  global_leverage_default: 3        

# 🧬 IMMUNE SYSTEM: Exit on probability drop
IMMUNE_SYSTEM: { alpha_slow_rise: 0.15, alpha_fast_fall: 0.70, panic_exit_threshold: 0.55 }

# ═══════════════════════════════════════════════════════════════════════
# PHANTOM REGIME (Single Active Strategy)
# Matches Phantom V8 backtest parameters ($20 → $79M)
# ═══════════════════════════════════════════════════════════════════════
REGIMES:
  # PHANTOM: Deep Learning ETH Specialist
  PHANTOM:
    leverage: 5
    entry_threshold: 0.55        # Confidence > 55% to enter
    hard_stop_roe: -0.015        # -1.5% stop loss (= -4.5% with 3x leverage)
    tp_roe: 0.06                 # 6% take profit (= 18% with 3x leverage)
    be_roe: 0.10                 # 10% ROE activates break-even
    trailing_step: 0.015         # 1.5% trailing stop
    trailing_activation_roe: 0.15 # Activate trailing at 15% ROE
    trailing_callback_roe: 0.30   # 30% callback (Safety Net)
    max_trade_duration_ms: 14400000 # 4 Hours (Fixed Exit)
    forbidden_hours: [0, 1, 22, 23] # UTC Hours to avoid
    forbidden_days: [2]             # Tuesday (0=Sun, 1=Mon, 2=Tue)

