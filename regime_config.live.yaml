# ═══════════════════════════════════════════════════════════════════════
# PHANTOM V1: Deep Learning Trading (ETH Specialist)
# ═══════════════════════════════════════════════════════════════════════
SYMBOLS:
  # Only ETH for now - BTC/SOL Phantom models coming in future
  ETHUSDT: 1.0

TRADING:
  capital_usage_default: 1.0        
  min_wallet_reserve_usdt: 0         
  fee_buffer_pct: 0.03            
  max_risk_pct: 0.02                 
  low_funds_threshold: 2             
  reenter_on_tp: true               
  post_exit_timeout_ms: 60000       

SYSTEM:
  tick_interval_ms: 2000
  max_trades_per_day: 100
  global_leverage_default: 20       
  enable_sentinel: false

# 🧬 IMMUNE SYSTEM: Exit on probability drop
IMMUNE_SYSTEM: { alpha_slow_rise: 0.15, alpha_fast_fall: 0.70, panic_exit_threshold: 0.55 }

# ═══════════════════════════════════════════════════════════════════════
# PHANTOM REGIME (Single Active Strategy)
# Matches Phantom V8 backtest parameters ($20 → $79M)
# ═══════════════════════════════════════════════════════════════════════
REGIMES:
  # PHANTOM: Deep Learning ETH Specialist
  PHANTOM:
    leverage: 20
    entry_threshold: 0.45        
    hard_stop_roe: -0.50          # -50% ROE (-2.5% price) to survive wicks
    tp_roe: 1.50                  # 150% ROE (7.5% price) - Phase 1: Ride the Wave
    be_roe: 99.0                  # No breakeven (AI Exit handles this)
    trailing_step: 0.015         
    trailing_activation_roe: 0.40 # Activate trailing at 40% ROE (turned off previously)
    trailing_callback_roe: 0.15   # Close if gives back 15% from peak (was 25%)
    max_trade_duration_ms: 28800000  # 8 hours (was 2h) - more room to reach 150%
    forbidden_hours: [] 
    forbidden_days: []              
    use_exit_agent: false         # Toggle for V3 Exit Veto and Panic Close
